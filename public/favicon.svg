<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1026" />
      <stop offset="100%" stop-color="#2d1b4e" />
    </linearGradient>
    <linearGradient id="islandGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a6f44" />
      <stop offset="40%" stop-color="#4a3728" />
      <stop offset="100%" stop-color="#1b120c" />
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#70e2ff" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#skyGrad)" />
  <!-- Moon -->
  <circle cx="48" cy="16" r="8" fill="#e0e7ff" opacity="0.9" />
  <circle cx="48" cy="16" r="11" fill="#818cf8" opacity="0.2" />
  <!-- Floating Island -->
  <path d="M 12 36 Q 32 32 52 36 Q 50 44 42 49 Q 32 56 26 51 Q 14 45 12 36 Z" fill="url(#islandGrad)" />
  <!-- Crystal on island -->
  <polygon points="32,20 36,28 32,32 28,28" fill="url(#crystalGrad)" opacity="0.95" />
  <!-- Waterfall -->
  <path d="M 42 36 Q 44 46 43 58" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <!-- Clouds -->
  <ellipse cx="20" cy="56" rx="16" ry="6" fill="#e0e7ff" opacity="0.25" />
  <ellipse cx="44" cy="58" rx="18" ry="7" fill="#e0e7ff" opacity="0.3" />
</svg>
